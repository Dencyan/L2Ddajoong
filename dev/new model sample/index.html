<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live2D Showcase Card</title>
  <style>
    :root {
      color-scheme: light;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    html {
      overscroll-behavior-x: none;
      touch-action: none;
      background: #f4f2ff;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background:
        radial-gradient(circle at top, rgba(150, 163, 255, 0.2), transparent 24%),
        linear-gradient(180deg, #f7f5ff 0%, #f1effd 100%);
    }

    .showcase-shell {
      width: min(440px, 92vw);
      display: grid;
      gap: 14px;
    }

    .showcase-card {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid rgba(133, 133, 164, 0.18);
      background:
        radial-gradient(circle at top, rgba(205, 214, 255, 0.28), transparent 42%),
        #ffffff;
      box-shadow:
        0 18px 50px rgba(79, 84, 131, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .showcase-card.is-loading::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          110deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(226, 232, 255, 0.48) 38%,
          rgba(255, 255, 255, 0) 62%
        );
      transform: translateX(-100%);
      animation: showcase-shimmer 1.6s ease-in-out infinite;
      pointer-events: none;
      z-index: 2;
    }

    .showcase-card canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    .showcase-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      gap: 12px;
      align-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(225, 230, 255, 0.9), rgba(255, 255, 255, 0.92)),
        rgba(255, 255, 255, 0.88);
      z-index: 3;
      transition: opacity 240ms ease, visibility 240ms ease;
    }

    .showcase-loading[hidden] {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      display: grid;
    }

    .showcase-spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(128, 138, 212, 0.18);
      border-top-color: #7f88d8;
      animation: showcase-spin 0.9s linear infinite;
    }

    .showcase-loading-text {
      margin: 0;
      color: #666c97;
      font: 600 13px/1.5 "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .showcase-controls {
      display: grid;
      gap: 10px;
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .showcase-controls.is-disabled {
      opacity: 0.45;
      transform: translateY(4px);
      pointer-events: none;
    }

    .showcase-control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 26px rgba(85, 90, 138, 0.1);
    }

    .showcase-control-title {
      flex: 0 0 100%;
      margin: 0;
      color: #6b709a;
      font: 700 11px/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #view-buttons,
    #expression-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .showcase-button {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: #eef1ff;
      color: #5b6091;
      font: 600 12px/1 "Segoe UI", sans-serif;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease, color 160ms ease;
    }

    .showcase-button.is-active {
      background: #cfd8ff;
      color: #414779;
    }

    .showcase-button:hover {
      background: #dfe5ff;
      transform: translateY(-1px);
    }

    .showcase-button:active {
      transform: translateY(0);
    }

    .showcase-label {
      margin: 0;
      text-align: center;
      color: #7e83c5;
      font: 700 12px/1.2 "Segoe UI", sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    @keyframes showcase-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes showcase-shimmer {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(100%);
      }
    }
  </style>
  <script src="./Core/live2dcubismcore.min.js"></script>
  <script type="module" crossorigin src="./assets/index-BkmBZ8n7.js"></script>
</head>
<body>
  <main class="showcase-shell">
    <p class="showcase-label">Live2D 샘플</p>
    <section id="live2d-stage" class="showcase-card is-loading">
      <div id="showcase-loading" class="showcase-loading" aria-live="polite">
        <div class="showcase-spinner" aria-hidden="true"></div>
        <p id="showcase-loading-text" class="showcase-loading-text">
          모델을 불러오는 중...
        </p>
      </div>
    </section>
    <section id="showcase-controls" class="showcase-controls is-disabled" aria-label="Live2D controls">
      <div class="showcase-control-group">
        <p class="showcase-control-title">화면</p>
        <div id="view-buttons"></div>
      </div>
      <div class="showcase-control-group">
        <p class="showcase-control-title">표정</p>
        <div id="expression-buttons"></div>
      </div>
    </section>
  </main>
</body>
</html>
